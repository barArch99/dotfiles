general {
    hide_cursor = true
}

background {
    path = ~/Pictures/wallpaper.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
}

label {
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(00bfffee)
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = ACCESS RESTRICTED · ecorp@blackarch
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(c8d3e0cc)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 320, 50
    outline_thickness = 2
    outer_color = rgba(00bfffee)
    inner_color = rgba(05070dcc)
    font_color = rgb(c8d3e0)
    check_color = rgba(33d6ffee)
    fail_color = rgba(ff4d4dee)
    placeholder_text = <i>password...</i>
    fail_text = <b>ACCESS DENIED</b>
    fade_on_empty = false
    rounding = 6
    position = 0, -40
    halign = center
    valign = center
}
